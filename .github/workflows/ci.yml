name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (syntax-check elk bestand)
        run: python -m compileall -q agency_os tests

      - name: Test
        run: python -m unittest discover -s tests -v
